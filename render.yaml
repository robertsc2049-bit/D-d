# One-click deploy on Render (render.com -> New -> Blueprint -> pick this repo).
# A persistent disk needs a paid instance type; without it, campaigns are wiped on every restart.
services:
  - type: web
    name: solo-adventure-engine
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATA_FILE
        value: /var/data/campaigns.json
    disk:
      name: campaign-data
      mountPath: /var/data
      sizeGB: 1
